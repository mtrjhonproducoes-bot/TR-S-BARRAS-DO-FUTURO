<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Três Barras do Futuro - Rotas de Ônibus</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.85);
      --primary: #00f0ff;
      --secondary: #7000ff;
      --accent: #00ff66;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: rgba(0, 240, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 12px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .header p {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    /* Botão de Ação Principal */
    .btn-add {
      width: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Campo de Busca */
    .search-box {
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* Formulário de Adicionar Rota */
    .form-card {
      display: none;
      background: rgba(10, 15, 25, 0.95);
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .form-card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-save {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Lista de Rotas */
    .routes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .route-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      position: relative;
      transition: all 0.2s;
    }

    .route-card:hover {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .route-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 700;
    }

    .route-fare {
      background: rgba(0, 255, 102, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .route-path {
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .route-stops {
      font-size: 0.75rem;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .route-times {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 600;
    }

    .btn-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #ff4d4d;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.7;
    }

    .btn-delete:hover {
      opacity: 1;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>Três Barras do Futuro</h1>
      <p>Sistema de Rotas & Itinerários de Ônibus</p>
    </div>

    <!-- Botão para abrir o formulário -->
    <button class="btn-add" onclick="toggleForm(true)">
      ➕ ADICIONAR NOVA ROTA
    </button>

    <!-- Formulário para Incluir Novas Rotas -->
    <div class="form-card" id="formCard">
      <h2>Cadastrar Nova Linha</h2>
      
      <div class="form-group">
        <label>Nome/Número da Linha:</label>
        <input type="text" id="inputName" placeholder="Ex: Linha 101 - Centro / São Cristóvão">
      </div>

      <div class="form-group">
        <label>Bairro de Origem ➔ Bairro de Destino:</label>
        <input type="text" id="inputPath" placeholder="Ex: Centro ➔ São Cristóvão">
      </div>

      <div class="form-group">
        <label>Paradas / Itinerário (Separados por vírgula):</label>
        <textarea id="inputStops" rows="2" placeholder="Ex: Praça Central, Hospital, Marcílio Dias, Escola"></textarea>
      </div>

      <div class="form-group">
        <label>Horários de Saída:</label>
        <input type="text" id="inputTimes" placeholder="Ex: 06:30, 07:15, 12:00, 17:45">
      </div>

      <div class="form-group">
        <label>Valor da Tarifa (R$):</label>
        <input type="number" id="inputFare" step="0.50" placeholder="Ex: 5.00">
      </div>

      <div class="form-buttons">
        <button class="btn-save" onclick="saveRoute()">Salvar Rota</button>
        <button class="btn-cancel" onclick="toggleForm(false)">Cancelar</button>
      </div>
    </div>

    <!-- Barra de Pesquisa -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Buscar por bairro ou linha..." oninput="renderRoutes()">
    </div>

    <!-- Lista de Rotas Cadastradas -->
    <div class="routes-list" id="routesList">
      <!-- As rotas serão renderizadas aqui via JS -->
    </div>
  </div>

  <script>
    // Rotas Iniciais Padrão de Três Barras
    const defaultRoutes = [
      {
        id: 1,
        name: "Linha 01 - Centro / São Cristóvão",
        path: "Terminal Centro ➔ Distrito de São Cristóvão",
        stops: "Terminal Urbano, Av. Santa Catarina, Posto de Saúde, Escola Municipal, Distrito de São Cristóvão",
        times: "06:15, 07:00, 11:45, 13:15, 17:30, 18:20",
        fare: 5.00
      },
      {
        id: 2,
        name: "Linha 02 - Marcílio Dias Expresso",
        path: "Centro ➔ Marcílio Dias",
        stops: "Praça Central, Estação Ferroviária, Marcílio Dias, Unidade Escolar",
        times: "06:45, 08:00, 12:15, 16:50, 18:00",
        fare: 5.00
      },
      {
        id: 3,
        name: "Linha 03 - Campina dos Mirek",
        path: "São Cristóvão ➔ Campina dos Mirek",
        stops: "Distrito São Cristóvão, Rodovia SC-477, Campina dos Mirek",
        times: "07:00, 12:00, 17:15",
        fare: 5.50
      }
    ];

    // Carrega do localStorage ou inicia com as padrão
    function getRoutes() {
      const stored = localStorage.getItem('tb_futuro_rotas');
      if (stored) {
        return JSON.parse(stored);
      } else {
        localStorage.setItem('tb_futuro_rotas', JSON.stringify(defaultRoutes));
        return defaultRoutes;
      }
    }

    // Exibe/oculta o formulário de cadastro
    function toggleForm(show) {
      document.getElementById('formCard').style.display = show ? 'block' : 'none';
    }

    // Salva uma nova rota informada pelo usuário
    function saveRoute() {
      const name = document.getElementById('inputName').value.trim();
      const path = document.getElementById('inputPath').value.trim();
      const stops = document.getElementById('inputStops').value.trim();
      const times = document.getElementById('inputTimes').value.trim();
      const fare = parseFloat(document.getElementById('inputFare').value) || 0;

      if (!name || !path) {
        alert("Por favor, preencha pelo menos o Nome da Linha e o Trajeto!");
        return;
      }

      const routes = getRoutes();
      const newRoute = {
        id: Date.now(),
        name,
        path,
        stops,
        times,
        fare
      };

      routes.unshift(newRoute);
      localStorage.setItem('tb_futuro_rotas', JSON.stringify(routes));

      // Limpa formulário e atualiza lista
      document.getElementById('inputName').value = '';
      document.getElementById('inputPath').value = '';
      document.getElementById('inputStops').value = '';
      document.getElementById('inputTimes').value = '';
      document.getElementById('inputFare').value = '';

      toggleForm(false);
      renderRoutes();
    }

    // Deleta uma rota
    function deleteRoute(id) {
      if (confirm("Tem certeza que deseja apagar esta rota?")) {
        let routes = getRoutes();
        routes = routes.filter(r => r.id !== id);
        localStorage.setItem('tb_futuro_rotas', JSON.stringify(routes));
        renderRoutes();
      }
    }

    // Renderiza as rotas na tela com suporte à busca
    function renderRoutes() {
      const routes = getRoutes();
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('routesList');

      const filtered = routes.filter(r => 
        r.name.toLowerCase().includes(query) ||
        r.path.toLowerCase().includes(query) ||
        r.stops.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-msg">Nenhuma rota encontrada para "${query}".</div>`;
        return;
      }

      container.innerHTML = filtered.map(r => `
        <div class="route-card">
          <button class="btn-delete" onclick="deleteRoute(${r.id})" title="Excluir Rota">✕ Excluir</button>
          <div class="route-header">
            <span class="route-title">${r.name}</span>
            <span class="route-fare">R$ ${r.fare.toFixed(2).replace('.', ',')}</span>
          </div>
          <div class="route-path">📍 ${r.path}</div>
          ${r.stops ? `<div class="route-stops"><strong>Paradas:</strong> ${r.stops}</div>` : ''}
          ${r.times ? `<div class="route-times">🕒 Horários: ${r.times}</div>` : ''}
        </div>
      `).join('');
    }

    // Inicialização
    renderRoutes();
  </script>
</body>
</html>
